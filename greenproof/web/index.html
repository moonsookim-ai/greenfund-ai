<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GREEN PROOF · 3년 전 심은 나무, 지금 위성에서 이렇게 보입니다</title>
<meta name="description" content="환경재단 위성 검증소. 조림 구획을 유럽 코페르니쿠스 Sentinel-2 위성 영상으로 판독해 임관 피복률·정착 추정률·흡수 탄소량을 오차 범위와 함께 공개합니다. 관측에 쓴 위성 장면도 전부 공개합니다.">
<link rel="canonical" href="https://greenfund.ai.kr/">
<meta name="theme-color" content="#14663a">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GREEN PROOF · 환경재단 위성 검증소">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://greenfund.ai.kr/">
<meta property="og:title" content="3년 전 심은 나무, 지금 위성에서 이렇게 보입니다">
<meta property="og:description" content="심었다는 말 대신 살아 있다는 증거를 냅니다. Sentinel-2 위성으로 임관 피복 5% → 84%, 관측에 쓴 장면까지 전부 공개.">
<meta property="og:image" content="https://greenfund.ai.kr/og.png?v=1">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="같은 구획의 2022년과 2026년 위성 영상. 왼쪽은 맨땅, 오른쪽은 초록으로 덮여 있다.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="3년 전 심은 나무, 지금 위성에서 이렇게 보입니다">
<meta name="twitter:description" content="환경재단 위성 검증소. 임관 피복 5% → 84%, 관측 장면 전량 공개.">
<meta name="twitter:image" content="https://greenfund.ai.kr/og.png?v=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314663a'/%3E%3Cpath d='M9 21c0-6 4-10 10-11-1 7-4 11-10 11z' fill='%233ddc84'/%3E%3Cpath d='M9 23c2-3 5-5 9-6' stroke='%23e9b341' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f8f6; --card:#fff; --ink:#14201a; --muted:#5d6f66; --line:#dde5e0;
  --green:#1f9d55; --green-dk:#14663a; --gold:#b98900; --warn:#c2410c; --shadow:0 1px 3px rgba(20,40,30,.07),0 8px 24px rgba(20,40,30,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1411; --card:#141d19; --ink:#e8f0ea; --muted:#93a89c; --line:#243029;
        --green:#3ddc84; --green-dk:#7ee2ad; --gold:#e3b341; --warn:#fb923c; --shadow:0 1px 3px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}
a{color:inherit}
/* 가로로 넓은 구획일 때만 재생 카드가 본문 폭을 넘어 확장한다.
   세로로 긴 구획에서 카드를 늘리면 양옆에 빈 공간만 생긴다. 본문 글줄 폭은 항상 지킨다. */
@media(min-width:1220px){ .card.player.wide{margin-inline:-160px} }
@media(min-width:1520px){ .card.player.wide{margin-inline:-270px} }

header.top{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;padding:14px 20px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:.14em;font-size:13px}
.brand em{font-style:normal;color:var(--green)}
.brand small{display:block;letter-spacing:0;font-weight:600;font-size:11px;color:var(--muted);margin-top:2px}
select{margin-left:auto;padding:8px 12px;border-radius:9px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font:inherit;font-size:13px;max-width:100%}

.hero{padding:52px 0 24px}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--green);font-weight:800}
h1{font-size:clamp(26px,5vw,40px);line-height:1.28;margin:12px 0 10px;letter-spacing:-.02em}
.lede{color:var(--muted);font-size:16px;margin:0;max-width:62ch}

.badges{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.badge{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.badge.ok{color:var(--green-dk);border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.badge.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.badge.grey{color:var(--muted)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin:20px 0}
.card h2{font-size:17px;margin:0 0 4px}
.card .sub{color:var(--muted);font-size:13px;margin:0 0 16px}

/* player */
.playgrid{display:grid;gap:18px;align-items:start}
@media(min-width:1024px){ .playgrid{grid-template-columns:minmax(0,1fr) 296px} }

.stagebox{--maxh:70vh;min-width:0;display:flex;flex-direction:column;align-items:center}
@media(min-width:700px){ .stagebox{--maxh:68vh} }
@media(min-width:1024px){ .stagebox{--maxh:84vh} }
/* 조작부와 눈금은 영상 폭에 맞춘다. 따로 놀면 화면이 흐트러진다. */
.stagebox .controls,.stagebox .ticks{width:min(100%,calc(var(--maxh) * var(--ar,1)))}
.stage{position:relative;border-radius:13px;overflow:hidden;background:#0a0f0c;
  aspect-ratio:var(--ar,1);max-height:var(--maxh);margin:0 auto;
  width:min(100%,calc(var(--maxh) * var(--ar,1)))}
.stage:fullscreen{width:100vw;height:100vh;max-height:none;border-radius:0;aspect-ratio:auto}
.stage:fullscreen img{object-fit:contain;background:#050907}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .28s ease}
.stage img.on{opacity:1}
.stage .clip{position:absolute;inset:0;overflow:hidden;width:50%}
.stage .clip img{width:auto;height:100%;min-width:100%;object-fit:cover;opacity:1;transition:none}
.handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:50%;transform:translateX(-1.5px);box-shadow:0 0 0 1px rgba(0,0,0,.35);pointer-events:none}
.handle::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:50%;background:#fff;color:#14201a;display:grid;place-items:center;font-weight:800;font-size:16px}
.cmp-tag{position:absolute;top:12px;font-size:11px;font-weight:800;letter-spacing:.08em;background:rgba(0,0,0,.6);color:#fff;padding:4px 9px;border-radius:6px}

.controls{display:flex;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;font-size:13px;font-weight:700}
button.primary{background:var(--green);border-color:var(--green);color:#04150c}
button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#04150c}
input[type=range]{flex:1;min-width:150px;accent-color:var(--green);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
#fs{display:none}
@media(min-width:1024px){ #fs{display:inline-block} }
/* 손가락으로 누르는 화면에서는 목표 크기를 44px 이상으로 둔다 */
@media(pointer:coarse){ button{min-height:44px;padding:10px 15px} select{min-height:44px} }
@media(max-width:620px){
  .controls{gap:8px}
  .controls button{flex:1 1 auto;min-height:44px}
  .controls input[type=range]{flex-basis:100%;order:9;min-width:0}
  .card{padding:16px;border-radius:14px}
  .wrap{padding:0 14px 60px}
  .hero{padding:34px 0 16px}
}

/* 재생 카드 옆 요약 패널. 넓은 화면의 남는 가로 폭을 정보로 채운다. */
.side{border:1px solid var(--line);border-radius:13px;padding:16px;font-size:13px}
.side h3{margin:0 0 2px;font-size:13px;color:var(--muted)}
.side .big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0;font-variant-numeric:tabular-nums}
.side .row{padding:12px 0;border-bottom:1px solid var(--line)}
.side .row:last-child{border-bottom:0;padding-bottom:0}
.side .row:first-child{padding-top:0}
.legend{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.swatch{width:14px;height:14px;border-radius:4px;background:var(--green);opacity:.7;flex:none}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:13px;padding:15px}
.stat .k{font-size:12px;color:var(--muted);font-weight:700}
.stat .v{font-size:27px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.stat .r{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* chart */
svg.chart{width:100%;height:230px;display:block}
.axis{stroke:var(--line)} .grid{stroke:var(--line);stroke-dasharray:3 4}
.tick{fill:var(--muted);font-size:11px}
.dot{fill:var(--green)} .line{fill:none;stroke:var(--green);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.band{fill:var(--green);opacity:.13}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:700;font-size:12px}
.scroll{overflow-x:auto}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
details summary{cursor:pointer;font-weight:700;font-size:14px}
details ul{color:var(--muted);font-size:13px;padding-left:18px}
.note{font-size:13px;color:var(--muted)}
.kicker{font-weight:800;color:var(--ink)}
footer{border-top:1px solid var(--line);margin-top:40px;padding-top:20px;font-size:12px;color:var(--muted)}
.err{padding:40px 0;color:var(--warn);font-weight:700}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand">GREEN <em>PROOF</em><small>환경재단 위성 검증소</small></div>
  <select id="siteSel" aria-label="구획 선택"></select>
</div></header>

<div class="wrap" id="app">
  <section class="hero">
    <div class="eyebrow">SATELLITE VERIFIED</div>
    <h1 id="title">불러오는 중</h1>
    <p class="lede" id="lede"></p>
    <div class="badges" id="badges"></div>
  </section>
  <div id="body"></div>
</div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const fmt = (n,d=1)=> n==null||!isFinite(n) ? "—" : n.toLocaleString("ko-KR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = n => n==null||!isFinite(n) ? "—" : (n*100).toFixed(0)+"%";

let R=null, frames=[], rawFrames=[], idx=0, timer=null, mode="lapse", overlayOn=true;
const set = ()=> overlayOn ? frames : (rawFrames.length ? rawFrames : frames);

async function boot(){
  let index;
  try{ index = await (await fetch("data/index.json",{cache:"no-store"})).json(); }
  catch(e){ $("#app").innerHTML='<p class="err">검증 데이터가 없습니다. 먼저 <code>python greenproof.py verify</code> 를 실행하십시오.</p>'; return; }
  const sel = $("#siteSel");
  sel.innerHTML = index.sites.map(s=>`<option value="${s.id}">${s.label}</option>`).join("");
  const want = new URLSearchParams(location.search).get("plot");
  if(want && index.sites.some(s=>s.id===want)) sel.value = want;
  sel.onchange = ()=>{ history.replaceState({},"","?plot="+sel.value); load(sel.value); };
  load(sel.value);
}

async function load(id){
  stop();
  R = await (await fetch(`data/${id}/report.json`,{cache:"no-store"})).json();
  frames = R.frames.map(f=>`data/${id}/${f}`);
  rawFrames = (R.frames_raw||[]).map(f=>`data/${id}/${f}`);
  idx = frames.length-1;
  render();
}

function render(){
  const isControl = R.coords_status==="control";
  $("#title").textContent = isControl
    ? "판독 규칙이 맞는지 먼저 확인합니다"
    : "3년 전 심은 나무, 지금 위성에서 이렇게 보입니다";
  $("#lede").textContent = isControl
    ? "검증하는 기관은 자기 방법부터 검증받아야 합니다. 성숙한 맹그로브림을 같은 규칙으로 읽어, 나오리라 예상한 값이 실제로 나오는지 대조합니다."
    : `${R.label} · 관측 면적 ${fmt(R.area_ha)} ha · 유럽 코페르니쿠스 Sentinel-2 위성이 ${R.series[0].date} 부터 ${R.series.at(-1).date} 까지 찍어 둔 것을 읽었습니다.`;

  const ev = R.evergreen||{}, v = R.verdict||{};
  $("#badges").innerHTML = [
    `<span class="badge ${isControl?'grey':'ok'}">판정 · ${v.label||"—"}</span>`,
    ev.flag? `<span class="badge ${ev.flag==="상록 정합"?"ok":ev.flag==="계절 작물 의심"?"warn":"grey"}">상록성 · ${ev.flag}</span>`:"",
    isControl ? `<span class="badge grey">대조군 구획</span>`
      : R.coords_status==="confirmed" ? `<span class="badge ok">좌표 확정</span>` : "",
    `<span class="badge grey">관측 ${R.series.length}개 시점</span>`
  ].join("");

  const s0=R.series[0], s1=R.series.at(-1), est=R.establishment||{}, car=R.carbon||{}, tr=R.trend||{};
  $("#body").innerHTML = `
  <section class="card player">
    <h2>${s0.year}년 → ${s1.year}년</h2>
    <p class="sub">초록 음영은 위성이 임관(수관)으로 판정한 화소입니다. 판정 기준은 NDVI ${R.method.canopy_threshold} 이상.</p>
    <div class="playgrid">
      <div class="stagebox" style="--ar:${R.frame_aspect||1}">
        <div class="stage" id="stage"></div>
        <div class="controls">
          <button class="primary" id="play">▶ 재생</button>
          <button id="mLapse" aria-pressed="true">타임랩스</button>
          <button id="mCmp" aria-pressed="false">전후 비교</button>
          <button id="mOv" aria-pressed="true" title="위성 원본만 볼지, 판정 음영을 겹칠지">판정 음영</button>
          <button id="fs" title="전체 화면으로 보기">⤢ 크게</button>
          <input type="range" id="scrub" min="0" max="${frames.length-1}" value="${idx}">
        </div>
        <div class="ticks">${R.series.map(s=>`<span>${s.year}</span>`).join("")}</div>
      </div>

      <aside class="side">
        <div class="row">
          <h3>${s1.year}년 임관 피복률</h3>
          <p class="big">${pct(s1.canopy_frac)}</p>
          <p class="note" style="margin:2px 0 0">${s0.year}년 ${pct(s0.canopy_frac)} 에서 출발</p>
        </div>
        <div class="row">
          <h3>증가 면적</h3>
          <p class="big" style="font-size:26px">${est.gain_ha>=0?"+":""}${fmt(est.gain_ha,2)} ha</p>
          <p class="note" style="margin:2px 0 0">범위 ${fmt(est.gain_ha_lo,2)} ~ ${fmt(est.gain_ha_hi,2)} ha</p>
        </div>
        <div class="row">
          <h3>판정</h3>
          <p style="margin:2px 0 0"><span class="kicker">${v.label||"—"}</span></p>
          <p class="note" style="margin:2px 0 0">${v.note||""}</p>
        </div>
        <div class="row">
          <h3>상록성 검사</h3>
          <p style="margin:2px 0 0"><span class="kicker">${ev.flag||"미실시"}</span>${ev.ratio!=null?` · ${fmt(ev.ratio,2)}`:""}</p>
        </div>
        <div class="row">
          <p class="legend"><span class="swatch"></span>초록 음영 = 임관으로 판정한 화소</p>
          ${R.video?`<p class="note" style="margin:8px 0 0">언론 배포용 · <a href="data/${R.site}/${R.video}" download>timelapse.mp4</a></p>`:""}
        </div>
      </aside>
    </div>
  </section>

  <section class="card">
    <h2>측정값</h2>
    <p class="sub">모든 값에 범위를 함께 싣습니다. 범위 없는 단일 숫자는 검증받을 수 없습니다.</p>
    <div class="stats">
      <div class="stat"><div class="k">임관 피복률</div><div class="v">${pct(s1.canopy_frac)}</div>
        <div class="r">${s0.year}년 ${pct(s0.canopy_frac)} 에서 출발</div></div>
      <div class="stat"><div class="k">임관 면적</div><div class="v">${fmt(s1.canopy_ha,2)} ha</div>
        <div class="r">${fmt(s1.canopy_ha_lo,2)} ~ ${fmt(s1.canopy_ha_hi,2)} ha</div></div>
      <div class="stat"><div class="k">증가 면적</div><div class="v">${est.gain_ha>=0?"+":""}${fmt(est.gain_ha,2)} ha</div>
        <div class="r">${fmt(est.gain_ha_lo,2)} ~ ${fmt(est.gain_ha_hi,2)} ha</div></div>
      <div class="stat"><div class="k">정착 추정률</div><div class="v">${pct(est.rate)}</div>
        <div class="r">${pct(est.rate_lo)} ~ ${pct(est.rate_hi)} · 하한 해석</div></div>
      <div class="stat"><div class="k">흡수 추정</div><div class="v">${fmt(car.tco2,0)} <span style="font-size:15px">tCO₂</span></div>
        <div class="r">${fmt(car.tco2_lo,0)} ~ ${fmt(car.tco2_hi,0)} · 계수 잠정</div></div>
      <div class="stat"><div class="k">연간 추세</div><div class="v">${tr.slope_pp_per_year>=0?"+":""}${fmt(tr.slope_pp_per_year,1)}<span style="font-size:15px">%P</span></div>
        <div class="r">결정계수 R² ${fmt(tr.r2,2)} · 관측 ${tr.n||0}회</div></div>
    </div>
  </section>

  <section class="card">
    <h2>임관 피복률 추이</h2>
    <p class="sub">건기(12~3월) 장면만 씁니다. 우기는 구름이 덮고 조위가 높아 갯벌 판독이 흔들립니다.</p>
    ${chart(R.series)}
  </section>

  <section class="card">
    <h2>이것이 정말 맹그로브인가</h2>
    <p class="sub">위성 지수만 보면 초록은 다 같은 초록입니다. 논밭을 숲으로 세지 않기 위해 계절을 교차 확인합니다.</p>
    <p style="margin:0 0 8px"><span class="kicker">${ev.flag||"미실시"}</span>
      ${ev.ratio!=null?` · 우기 임관 ÷ 건기 임관 = ${fmt(ev.ratio,2)}`:""}</p>
    <p class="note" style="margin:0">${ev.note||""}
      ${ev.wet_date?` (우기 관측 ${ev.wet_date}, 임관 ${pct(ev.wet_canopy_frac)})`:""}</p>
  </section>

  <section class="card">
    <h2>관측 원장</h2>
    <p class="sub">쓰인 위성 장면을 전부 공개합니다. 누구든 같은 장면으로 같은 계산을 다시 할 수 있습니다.</p>
    <div class="scroll"><table>
      <tr><th>연도</th><th>관측일</th><th>임관 피복</th><th>NDVI 평균</th><th>AOI 구름</th><th>장면 식별자</th></tr>
      ${R.series.map(s=>`<tr><td>${s.year}</td><td>${s.date}</td><td>${pct(s.canopy_frac)}</td>
        <td>${fmt(s.ndvi_mean,3)}</td><td>${pct(s.cloud_aoi)}</td>
        <td style="font-size:11px;color:var(--muted)">${s.scene}</td></tr>`).join("")}
    </table></div>

    <details><summary>산출 방법과 한계</summary>
      <ul>
        <li>원천 · ${R.method.source}</li>
        <li>지수 · ${R.method.index}, 임관 판정 ${R.method.canopy_threshold} (범위 판정 ${R.method.threshold_range.join(" ~ ")})</li>
        <li>구름 처리 · ${R.method.cloud_mask}</li>
        <li>탄소 계수 · ${R.carbon_coefficient.low}~${R.carbon_coefficient.high} ${R.carbon_coefficient.unit} · ${R.carbon_coefficient.source}</li>
        ${R.method.limits.map(l=>`<li>${l}</li>`).join("")}
      </ul>
    </details>
  </section>

  <footer>
    생성 ${(R.generated_at||"").replace("T"," ").replace("+00:00"," UTC")} ·
    관측 구획 ${R.aoi.map(v=>v.toFixed(4)).join(", ")} ·
    Contains modified Copernicus Sentinel data ${R.series[0].year}–${R.series.at(-1).year}
  </footer>`;

  mount();
}

function chart(series){
  const W=900,H=230,P={t:16,r:16,b:30,l:44};
  const xs=series.map((s,i)=>P.l+(W-P.l-P.r)*(series.length<2?0:i/(series.length-1)));
  const y=v=>H-P.b-(H-P.t-P.b)*Math.min(1,Math.max(0,v));
  const line=series.map((s,i)=>`${i?"L":"M"}${xs[i].toFixed(1)},${y(s.canopy_frac).toFixed(1)}`).join(" ");
  const band=[...series.map((s,i)=>`${i?"L":"M"}${xs[i].toFixed(1)},${y(s.canopy_frac_hi).toFixed(1)}`),
              ...series.slice().reverse().map((s,i)=>`L${xs[series.length-1-i].toFixed(1)},${y(s.canopy_frac_lo).toFixed(1)}`),"Z"].join(" ");
  const grid=[0,.25,.5,.75,1].map(g=>
    `<line class="grid" x1="${P.l}" x2="${W-P.r}" y1="${y(g)}" y2="${y(g)}"/>
     <text class="tick" x="${P.l-8}" y="${y(g)+4}" text-anchor="end">${g*100}%</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="임관 피복률 추이">
    ${grid}<path class="band" d="${band}"/><path class="line" d="${line}"/>
    ${series.map((s,i)=>`<circle class="dot" cx="${xs[i].toFixed(1)}" cy="${y(s.canopy_frac).toFixed(1)}" r="4.5"/>
      <text class="tick" x="${xs[i].toFixed(1)}" y="${H-10}" text-anchor="middle">${s.year}</text>`).join("")}
  </svg>`;
}

function mount(){
  // 가로로 넓은 구획에서만 재생 카드를 본문 폭 밖으로 넓힌다.
  if((R.frame_aspect||1) >= 1.1) document.querySelector(".player").classList.add("wide");
  drawStage();
  $("#play").onclick = ()=> timer? stop() : play();
  $("#mLapse").onclick = ()=> setMode("lapse");
  $("#mCmp").onclick = ()=> setMode("compare");
  $("#mOv").onclick = e=>{ overlayOn=!overlayOn; e.target.setAttribute("aria-pressed",overlayOn); stop(); drawStage(); };
  const fs=$("#fs"), st=$("#stage");
  if(!st.requestFullscreen) fs.style.display="none";
  else fs.onclick = ()=> document.fullscreenElement ? document.exitFullscreen() : st.requestFullscreen();
  const sc=$("#scrub");
  sc.oninput = e=>{ stop(); idx=+e.target.value; if(mode==="lapse") show(idx); };
}

function setMode(m){
  mode=m; stop();
  $("#mLapse").setAttribute("aria-pressed", m==="lapse");
  $("#mCmp").setAttribute("aria-pressed", m==="compare");
  $("#play").style.display = m==="lapse" ? "" : "none";
  $("#scrub").style.display = m==="lapse" ? "" : "none";
  drawStage();
}

function drawStage(){
  const st=$("#stage"), F=set();
  if(mode==="lapse"){
    st.innerHTML = F.map((f,i)=>`<img src="${f}" alt="${R.series[i].date} 위성 영상" class="${i===idx?"on":""}">`).join("");
  }else{
    st.innerHTML = `<img src="${F.at(-1)}" class="on" alt="최근 위성 영상">
      <div class="clip" id="clip"><img src="${F[0]}" alt="최초 위성 영상"></div>
      <div class="handle" id="handle"></div>
      <div class="cmp-tag" style="left:12px">${R.series[0].year}</div>
      <div class="cmp-tag" style="right:12px">${R.series.at(-1).year}</div>`;
    const move = e=>{
      const r=st.getBoundingClientRect();
      const x=Math.min(Math.max(((e.touches?e.touches[0].clientX:e.clientX)-r.left)/r.width,0),1);
      $("#clip").style.width=(x*100)+"%"; $("#handle").style.left=(x*100)+"%";
    };
    st.onpointermove = move; st.ontouchmove = move;
  }
}

function show(i){
  idx=i; $("#scrub").value=i;
  [...$("#stage").querySelectorAll("img")].forEach((im,k)=>im.classList.toggle("on",k===i));
}
function play(){
  const n=set().length;
  if(idx>=n-1) idx=-1;
  $("#play").textContent="⏸ 정지";
  timer=setInterval(()=>{
    if(idx>=n-1){ stop(); return; }
    show(idx+1);
  }, 15000/Math.max(1,n));
}
function stop(){
  if(timer) clearInterval(timer);
  timer=null;
  const b=$("#play"); if(b) b.textContent="▶ 재생";
}
boot();
</script>
</body>
</html>
